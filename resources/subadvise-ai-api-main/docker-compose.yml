services:
  subadvise-ai-api:
    build: .
    ports:
      - "7072:7072"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in the environment}
      SUBADVISE_API_BASE_URL: ${SUBADVISE_API_BASE_URL:-http://host.docker.internal:7071}
      CHAT_HISTORY_DIR: /app/data/chat_history
      CHAT_VECTOR_DIR: /app/data/chroma_db
    volumes:
      - chat_history:/app/data/chat_history
      - chat_vector:/app/data/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  chat_history:
  chat_vector: