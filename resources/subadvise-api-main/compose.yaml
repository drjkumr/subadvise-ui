services:
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-7071}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mariadb://db:3306/subadvise}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-subadvise}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
    ports:
      - "${SERVER_PORT:-7071}:${SERVER_PORT:-7071}"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-subadvise}
      MARIADB_USER: ${SPRING_DATASOURCE_USERNAME:-subadvise}
      MARIADB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mariadb-data: